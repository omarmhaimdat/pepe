# Custom dist publish job (see `publish-jobs` in dist-workspace.toml).
# Publishes packaging/pypi as `pepe-http` on PyPI: a small Python package
# whose `pepe` command downloads the release of the same version from
# GitHub on first run and runs it. The version is set from the release
# tag here, so a published package always fetches its own release, and the
# built wheel is installed and run once before it is published, against
# the release the host job has just created.
#
# Publishing is by PyPI trusted publishing, no token: the pepe-http project
# on PyPI must trust this repository and this workflow file,
# publish-pypi.yml (https://docs.pypi.org/trusted-publishers/).
name: Publish to PyPI

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-pypi:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set the version from the release
        shell: bash
        run: |
          set -euo pipefail
          version=$(echo "$PLAN" | jq -r '.releases[] | select(.app_name == "pepe") | .app_version')
          sed -i "s/^__version__ = \".*\"/__version__ = \"${version}\"/" packaging/pypi/pepe_http/__init__.py
          grep -n '^__version__' packaging/pypi/pepe_http/__init__.py

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m build packaging/pypi
          ls -la packaging/pypi/dist

      - name: Install the wheel and run it
        shell: bash
        run: |
          set -euo pipefail
          version=$(echo "$PLAN" | jq -r '.releases[] | select(.app_name == "pepe") | .app_version')
          python -m pip install packaging/pypi/dist/*.whl
          pepe --version | tee version.txt
          grep -q "${version}" version.txt

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packaging/pypi/dist/
