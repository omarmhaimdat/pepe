name: Release-plz

on:
  push:
    branches:
      - master

jobs:
  # Opens/updates the release PR with the next version and changelog
  release-plz-pr:
    name: Release PR
    if: github.repository_owner == 'omarmhaimdat'
    # Waits for the tag. Running both at once, merging a release PR let this
    # job see the new version before its tag existed, and it opened a
    # duplicate release PR for it
    needs: release-plz-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Require release token
        env:
          TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::RELEASE_PLZ_TOKEN secret is missing. Tags pushed with the default GITHUB_TOKEN do not trigger the release workflow."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # The plugin manifests carry the release's version, so a marketplace
      # can tell one release from another. release-plz bumps only Cargo.toml,
      # and rewrites its branch on every update, so this runs each time
      - name: Bump the plugin manifests on the release PR
        if: ${{ steps.release-plz.outputs.pr && fromJSON(steps.release-plz.outputs.pr).head_branch }}
        env:
          BRANCH: ${{ fromJSON(steps.release-plz.outputs.pr).head_branch }}
          TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          git fetch origin "$BRANCH"
          git switch --detach FETCH_HEAD
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          sed -i -E "s/^(  \"version\": \")[^\"]*\"/\1${version}\"/" \
            plugin.json .claude-plugin/plugin.json
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: plugin manifests at v$version"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

  # When the release PR is merged, pushes the vX.Y.Z tag
  release-plz-release:
    name: Tag release
    if: github.repository_owner == 'omarmhaimdat'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          # A PAT (not GITHUB_TOKEN) so the tag push triggers release.yml
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
