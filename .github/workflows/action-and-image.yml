# The GitHub Action (action.yml) and the from-source Dockerfile, tried on
# every change to them.
name: Action and image

on:
  pull_request:
    paths:
      - action.yml
      - Dockerfile
      - Dockerfile.release
      - .github/workflows/action-and-image.yml
  workflow_dispatch:

permissions:
  contents: read
  # The action comments on this pull request, as a user's would
  pull-requests: write

jobs:
  action:
    name: The action, against a local server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The pepe of this branch, not the last release: the action uses a
      # pepe already on the PATH
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Build pepe
        run: |
          cargo build --release --quiet
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: A target
        run: |
          python3 -m http.server 8089 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
      - name: Run pepe through the action
        id: pepe
        uses: ./
        with:
          url: http://127.0.0.1:8089/
          args: -n 300 -c 4
      - name: Outputs
        env:
          TOTAL: ${{ steps.pepe.outputs.total_requests }}
          FAILED: ${{ steps.pepe.outputs.failed_requests }}
          RPS: ${{ steps.pepe.outputs.requests_per_second }}
          P99: ${{ steps.pepe.outputs.p99_ms }}
          VERDICT: ${{ steps.pepe.outputs.verdict }}
        run: |
          echo "total=$TOTAL failed=$FAILED rps=$RPS p99=$P99"
          [ "$TOTAL" = "300" ] && [ "$FAILED" = "0" ]
          test -f "${{ steps.pepe.outputs.report }}"
          [ -z "$VERDICT" ]
      - name: The same run again, against the first as its baseline, gated and commented
        id: again
        uses: ./
        with:
          url: http://127.0.0.1:8089/
          args: -n 300 -c 4
          baseline: ${{ steps.pepe.outputs.report }}
          gate: true
          comment: true
      - name: A verdict, and the comparison
        env:
          VERDICT: ${{ steps.again.outputs.verdict }}
          COMPARE: ${{ steps.again.outputs.compare }}
        run: |
          echo "verdict=$VERDICT"
          case "$VERDICT" in faster|same|slower|better|worse) ;; *) exit 1 ;; esac
          jq -e '.changes | length > 0' "$COMPARE"
      - name: A condition that must fail the step
        id: should-fail
        continue-on-error: true
        uses: ./
        with:
          url: http://127.0.0.1:8089/
          args: -n 50 -c 2
          fail-if: ".summary.total_requests == 50"
      - name: It failed
        run: '[ "${{ steps.should-fail.outcome }}" = "failure" ]'

  image:
    name: The from-source image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pepe:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: It runs, and is small
        run: |
          docker run --rm pepe:test --version
          docker image inspect pepe:test --format 'size {{.Size}} bytes'
          python3 -m http.server 8089 --bind 0.0.0.0 >/dev/null 2>&1 &
          sleep 1
          docker run --rm --network host pepe:test --json -n 50 -c 2 http://127.0.0.1:8089/ | jq '.summary.total_requests'
