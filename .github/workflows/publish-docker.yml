# Custom dist publish job (see `publish-jobs` in dist-workspace.toml).
# Publishes ghcr.io/omarmhaimdat/pepe:<version> and :latest for linux/amd64
# and linux/arm64 from the static musl binaries the release built.
name: Publish to GHCR

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PLAN: ${{ inputs.plan }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/pepe
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch the release binaries
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true

      - name: Lay the binaries out per platform
        run: |
          set -euo pipefail
          mkdir -p bin/amd64 bin/arm64
          tar -xJf artifacts/pepe-x86_64-unknown-linux-musl.tar.xz --strip-components=1 -C bin/amd64 pepe-x86_64-unknown-linux-musl/pepe
          tar -xJf artifacts/pepe-aarch64-unknown-linux-musl.tar.xz --strip-components=1 -C bin/arm64 pepe-aarch64-unknown-linux-musl/pepe
          ls -la bin/amd64 bin/arm64
          version=$(echo "$PLAN" | jq -r '.releases[] | select(.app_name == "pepe") | .app_version')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "publishing $IMAGE:$version"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=pepe
            org.opencontainers.image.description=HTTP load generator with a live dashboard
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: It runs
        run: docker run --rm "$IMAGE:$VERSION" --version
