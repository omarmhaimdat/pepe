# Where pepe's CPU goes on Linux. Run by hand (workflow_dispatch), or on a
# PR that changes this file. Builds pepe with symbols, records it under perf
# on the plain-GET workload, counts syscalls per request for pepe and oha
# with strace, and keeps the reports as an artifact.
name: Profile on Linux

on:
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/profile-linux.yml"]

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: taiki-e/install-action@v2
        with:
          tool: oha

      - name: Install perf and strace
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq strace linux-tools-common linux-tools-generic "linux-tools-$(uname -r)" || true
          # The perf wrapper insists on a matching version; call a real one
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | tail -1 || true)
          [ -n "$PERF" ] || PERF=$(command -v perf)
          echo "PERF=$PERF" >> "$GITHUB_ENV"
          "$PERF" version
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0

      - name: Build pepe with symbols
        run: cargo build --profile profiling --locked && target/profiling/pepe --version

      - name: Build the variant under test
        # reqwest patched to skip its per-response URL re-parse (see
        # bench/patches and bench/README.md). mimalloc was tried here too:
        # 1-4% less CPU for 50-90% more memory on Linux, so it isn't kept.
        run: |
          set -euo pipefail
          mkdir -p out
          cp target/profiling/pepe out/pepe-base
          mkdir -p /tmp/vendor && cd /tmp/vendor
          curl -sSL https://crates.io/api/v1/crates/reqwest/0.12.28/download | tar xz
          (cd reqwest-0.12.28 && patch -p1 < "$GITHUB_WORKSPACE/bench/patches/reqwest-0.12.28-skip-url-reparse.patch")
          cd "$GITHUB_WORKSPACE"
          cp Cargo.toml /tmp/Cargo.toml.keep && cp Cargo.lock /tmp/Cargo.lock.keep
          printf '\n[patch.crates-io]\nreqwest = { path = "/tmp/vendor/reqwest-0.12.28" }\n' >> Cargo.toml
          cargo build --profile profiling
          cp target/profiling/pepe out/pepe-reqwest-patched
          cp /tmp/Cargo.toml.keep Cargo.toml && cp /tmp/Cargo.lock.keep Cargo.lock
          # perf below records the unpatched build
          cargo build --profile profiling --locked

      - name: Start the target server
        run: |
          go build -o /tmp/bench-server bench/server.go
          /tmp/bench-server > /tmp/server.log 2>&1 &
          for i in $(seq 1 150); do curl -sf http://127.0.0.1:8089/ >/dev/null && break; sleep 0.2; done
          curl -sf http://127.0.0.1:8089/ >/dev/null || { cat /tmp/server.log; exit 1; }

      - name: "CPU per request: pepe, the variant and oha, taking turns"
        run: |
          nproc | tee out/nproc.txt
          for i in 1 2 3; do
            for v in base reqwest-patched; do
              REQUESTS=200000 bench/measure.sh "pepe-$v" out/pepe-$v --json -n 200000 -c 64 http://127.0.0.1:8089/
            done
            REQUESTS=200000 bench/measure.sh oha oha --no-tui --output-format json -n 200000 -c 64 http://127.0.0.1:8089/
          done | tee out/reference.csv
          echo "--- gate: base vs reqwest-patched ---"
          bench/compare.sh out/pepe-base out/pepe-reqwest-patched 2 | tee out/gate.md

      - name: perf record pepe
        run: |
          set -x
          $PERF record -F 997 -g -o out/perf.data -- target/profiling/pepe --json -z 8s -c 64 http://127.0.0.1:8089/ > /dev/null
          $PERF report -i out/perf.data --no-children --sort dso --stdio 2>/dev/null | grep -v "^#" | grep -v "^$" | head -20 > out/perf-by-dso.txt
          $PERF report -i out/perf.data --no-children --sort symbol --stdio 2>/dev/null | grep -v "^#" | grep -v "^$" | head -60 > out/perf-self.txt
          $PERF report -i out/perf.data --children --sort symbol --stdio -g none 2>/dev/null | grep -v "^#" | grep -v "^$" | head -80 > out/perf-inclusive.txt
          $PERF report -i out/perf.data --no-children --sort symbol --stdio -g caller,0.5,callee --percent-limit 2 2>/dev/null | head -400 > out/perf-callgraph.txt
          $PERF report -i out/perf.data --no-children --sort symbol --stdio -g none --percent-limit 0.3 2>/dev/null | grep -v "^#" | grep -v "^$" > out/perf-self-flat.txt
          $PERF report -i out/perf.data --no-children --sort symbol --stdio -S malloc,cfree,realloc,_int_malloc,_int_free -g caller,0.3,callee 2>/dev/null | head -300 > out/perf-malloc-callers.txt
          rm -f out/perf.data

      - name: perf record oha, for the same picture
        run: |
          $PERF record -F 997 -g -o out/perf-oha.data -- oha --no-tui --output-format json -z 8s -c 64 http://127.0.0.1:8089/ > /dev/null
          $PERF report -i out/perf-oha.data --no-children --sort dso --stdio 2>/dev/null | grep -v "^#" | grep -v "^$" | head -20 > out/perf-oha-by-dso.txt
          $PERF report -i out/perf-oha.data --no-children --sort symbol --stdio 2>/dev/null | grep -v "^#" | grep -v "^$" | head -40 > out/perf-oha-self.txt
          rm -f out/perf-oha.data

      - name: Syscalls per request
        run: |
          strace -f -c -o out/strace-pepe.txt target/profiling/pepe --json -n 20000 -c 64 http://127.0.0.1:8089/ > /dev/null
          strace -f -c -o out/strace-oha.txt oha --no-tui --output-format json -n 20000 -c 64 http://127.0.0.1:8089/ > /dev/null
          strace -f -c -o out/strace-pepe-2threads.txt target/profiling/pepe --json --threads 2 -n 20000 -c 64 http://127.0.0.1:8089/ > /dev/null

      - name: Summary
        run: |
          {
            echo "## Reference ($(cat out/nproc.txt) vCPUs): label,wall,user,sys,cpu,ms per 1k,rss"
            echo '```'; cat out/reference.csv; echo '```'
            echo "## pepe, by DSO"; echo '```'; cat out/perf-by-dso.txt; echo '```'
            echo "## pepe, self time by symbol"; echo '```'; cat out/perf-self.txt; echo '```'
            echo "## oha, by DSO"; echo '```'; cat out/perf-oha-by-dso.txt; echo '```'
            echo "## oha, self time by symbol"; echo '```'; cat out/perf-oha-self.txt; echo '```'
            echo "## syscalls, pepe (20k requests)"; echo '```'; head -25 out/strace-pepe.txt; echo '```'
            echo "## syscalls, oha (20k requests)"; echo '```'; head -25 out/strace-oha.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: profile-linux-${{ github.run_number }}
          path: out/
