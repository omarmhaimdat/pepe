version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR for all semver-compatible bumps; majors get their own PRs
      cargo-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "fix(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Refs are toolchain names (@stable, @master), not versions
      - dependency-name: dtolnay/rust-toolchain
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
