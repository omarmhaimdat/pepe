[package]
name = "pepe"
version = "0.19.2"
authors = ["Omar MHAIMDAT"]
edition = "2021"
rust-version = "1.85"
description = "HTTP load generator and performance testing tool"
readme = "README.md"
homepage = "https://github.com/omarmhaimdat/pepe"
repository = "https://github.com/omarmhaimdat/pepe"
keywords = ["testing", "performance", "benchmark", "stress", "utility"]
categories = ["command-line-utilities", "network-programming"]
license = "MIT"
exclude = ["assets/*"]

[dependencies]
clap = { version = "4.5.24", features = ["derive"] }
tokio = { version = "1.42.0", features = ["full"] }
reqwest = { version = "0.12.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "socks",
] }
# The direct path (src/direct.rs): a connection per worker, read and
# written by pepe itself over the same rustls reqwest uses, with httparse
# for the response's head. All of these are in reqwest's own dependency
# tree already.
httparse = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
# Finding the ends of lines and fields in logs (src/logs.rs); in the tree
# already, under httparse's neighbours and regex-lite's
memchr = "2"
futures = "0.3.17"
bytes = "1"
# A layer around reqwest's connector, to time how long connections take
tower-layer = "0.3"
tower-service = "0.3"
ratatui = "0.29.0"
# event-stream: read keys asynchronously instead of blocking a runtime thread
crossterm = { version = "0.29.0", features = ["event-stream"] }
gethostname = "1.0.0"
serde = { version = "1.0.130", features = ["derive"] }
# preserve_order: the request inspector shows JSON keys in the order sent
serde_json = { version = "1.0", features = ["preserve_order"] }
axoupdater = "0.10.2"
semver = "1.0.28"
# OpenAPI specs are often YAML; this is the maintained fork of serde_yaml
serde_norway = "0.9"
regex-lite = "0.1"
toml = "0.9"

[dev-dependencies]
# contrib/: completions and man pages are generated by a test, which also
# checks that the committed files are current
clap_complete = "4.6"
clap_mangen = "0.3"
roff = "1"

[target.'cfg(unix)'.dependencies]
# Keeps Ctrl-C a signal while the dashboard has the terminal in raw mode
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.release.package."*"]
opt-level = 3
debug = false
strip = true

[[bin]]
name = "pepe"
path = "src/main.rs"

# Profile used by `dist build` for release artifacts.
[profile.dist]
inherits = "release"

# Release build with symbols, for `sample` / Instruments. See bench/README.md.
[profile.profiling]
inherits = "release"
debug = true
strip = false
