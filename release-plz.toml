# release-plz keeps an open "chore: release vX.Y.Z" PR on master that bumps
# Cargo.toml and CHANGELOG.md from conventional commits. When a push to master
# carries a Cargo.toml version that has no tag yet (i.e. that PR was merged),
# release-plz creates the vX.Y.Z tag, which triggers .github/workflows/release.yml
# (cargo-dist) to build every platform and publish GitHub Release, Homebrew,
# installers and R2.
[workspace]
# Not on crates.io (the `pepe` name is taken); versions come from git tags
git_only = true
publish = false
git_tag_name = "v{{ version }}"
# cargo-dist creates the GitHub Release with all binaries attached
git_release_enable = false
# Binary crate: no public Rust API to semver-check
semver_check = false
# Before 1.0, a release with any feat: commit bumps the minor version
# (0.3.x -> 0.4.0) and fix-only releases bump the patch
features_always_increment_minor = true
# Only features, fixes and performance work are worth a release; chores,
# CI and docs changes ride along with the next one instead of making their own
release_commits = "^(feat|fix|perf)[(:!]"
pr_labels = ["release"]

[changelog]
# Each entry is the commit's subject followed by its body, indented under
# it, so the explanation written with the commit is what the release notes
# say. The hidden comments order the groups.
body = """
## [{{ version | trim_start_matches(pat="v") }}]\
{%- if release_link -%}({{ release_link }}){% endif %} \
- {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | trim }}
{%- if commit.body %}

{{ commit.body | trim | indent(prefix="  ", first=true) }}
{% endif %}
{% endfor %}
{% endfor %}
"""
commit_parsers = [
    # A merge commit says nothing a reader needs; the squashed PR commit does
    { message = "^Merge ", skip = true },
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^.*", group = "<!-- 3 -->Other" },
]
