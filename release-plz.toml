# release-plz keeps an open "chore: release vX.Y.Z" PR on master that bumps
# Cargo.toml and CHANGELOG.md from conventional commits. When a push to master
# carries a Cargo.toml version that has no tag yet (i.e. that PR was merged),
# release-plz creates the vX.Y.Z tag, which triggers .github/workflows/release.yml
# (cargo-dist) to build every platform and publish GitHub Release, Homebrew,
# installers and R2.
[workspace]
# Not on crates.io (the `pepe` name is taken); versions come from git tags
git_only = true
publish = false
git_tag_name = "v{{ version }}"
# cargo-dist creates the GitHub Release with all binaries attached
git_release_enable = false
# Binary crate: no public Rust API to semver-check
semver_check = false
pr_labels = ["release"]
